[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tplink-admin-cli"
version = "0.5.3"
description = "Small CLI for managing a local TP-Link router admin page."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "requests>=2.33.1",
  "jsonschema>=4.18,<5",
  # SG transport adapters are verified against this SDK's wire behavior.
  # 5.37.0 rewrites JSON payloads as forms; see ADR 001 before upgrading.
  "tplinkrouterc6u==5.30.0",
]

[project.optional-dependencies]
test = ["openapi-spec-validator>=0.7,<0.8"]

[project.urls]
Homepage = "https://github.com/JithendraNara/tplinkctl"
Changelog = "https://github.com/JithendraNara/tplinkctl/blob/main/CHANGELOG.md"
Issues = "https://github.com/JithendraNara/tplinkctl/issues"

[project.scripts]
tplinkctl = "tplink_admin.cli:run"
tpadmin = "tplink_admin.cli:run"
tplinkctl-mcp = "tplink_admin.mcp:main"
tplinkctl-api = "tplink_admin.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
